	<script>
		let selectedGemstones = [];
		let customGemstoneName = '';

		const STANDARD_GEMS = ['diamante', 'esmeralda', 'rubi', 'zafiro', 'perla', 'aguamarina', 'topacio', 'turquesa', 'coral', 'sin_gema'];

		document.addEventListener('DOMContentLoaded', () => {
			const state = window.RometDesigner?.loadState() || {};
			const gemstoneVal = state.gemstone;
			if (gemstoneVal) {
				selectedGemstones = gemstoneVal.split(',').map(s => s.trim()).filter(Boolean);
				// Detect if custom gem is in selection
				const custom = selectedGemstones.find(g => !STANDARD_GEMS.includes(g.toLowerCase()));
				if (custom) {
					customGemstoneName = custom;
				}
			}
			if (selectedGemstones.length > 0) {
				document.getElementById('nextBtn').disabled = false;
			}
			updateUI();

			// Close modal on Escape
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') closeOtherGemsModal();
			});
		});

		function openOtherGemsModal() {
			const input = document.getElementById('customGemInput');
			input.value = customGemstoneName || '';
			const removeRow = document.getElementById('removeCustomGemRow');
			if (removeRow) {
				if (customGemstoneName && selectedGemstones.includes(customGemstoneName)) {
					removeRow.classList.remove('hidden');
				} else {
					removeRow.classList.add('hidden');
				}
			}
			const modal = document.getElementById('other-gems-modal');
			modal.classList.add('active');
			setTimeout(() => input.focus(), 150);
		}

		function closeOtherGemsModal() {
			const modal = document.getElementById('other-gems-modal');
			modal.classList.remove('active');
		}

		function closeOtherGemsModalOnOverlay(e) {
			if (e.target.id === 'other-gems-modal') {
				closeOtherGemsModal();
			}
		}

		function setCustomGemSuggestion(name) {
			const input = document.getElementById('customGemInput');
			input.value = name;
			input.focus();
		}

		function saveCustomGem() {
			const input = document.getElementById('customGemInput');
			const val = input.value.trim();
			if (!val) {
				input.focus();
				return;
			}

			// Remove sin_gema and previous custom gem
			selectedGemstones = selectedGemstones.filter(g => g !== 'sin_gema' && STANDARD_GEMS.includes(g.toLowerCase()));
			customGemstoneName = val;
			if (!selectedGemstones.includes(customGemstoneName)) {
				selectedGemstones.push(customGemstoneName);
			}

			saveAndRefresh();
			closeOtherGemsModal();
		}

		function removeCustomGem() {
			if (customGemstoneName) {
				selectedGemstones = selectedGemstones.filter(g => g !== customGemstoneName);
				customGemstoneName = '';
				saveAndRefresh();
			}
			closeOtherGemsModal();
		}

		function selectOption(el, key, value) {
			if (value === 'sin_gema') {
				selectedGemstones = ['sin_gema'];
				customGemstoneName = '';
			} else {
				selectedGemstones = selectedGemstones.filter(g => g !== 'sin_gema');
				if (selectedGemstones.includes(value)) {
					selectedGemstones = selectedGemstones.filter(g => g !== value);
				} else {
					selectedGemstones.push(value);
				}
			}
			saveAndRefresh();
		}

		function saveAndRefresh() {
			const state = window.RometDesigner?.loadState() || {};
			if (selectedGemstones.length > 0) {
				state['gemstone'] = selectedGemstones.join(', ');
				document.getElementById('nextBtn').disabled = false;
			} else {
				state['gemstone'] = null;
				document.getElementById('nextBtn').disabled = true;
			}
			window.RometDesigner?.saveState(state);
			updateUI();
		}

		function updateUI() {
			const cards = document.querySelectorAll('.cursor-pointer');
			const hasCustom = customGemstoneName && selectedGemstones.includes(customGemstoneName);

			cards.forEach(card => {
				const onclickStr = card.getAttribute('onclick') || '';

				if (card.id === 'card-otras-gemas') {
					const label = document.getElementById('label-otras-gemas');
					const sublabel = document.getElementById('sublabel-otras-gemas');
					if (hasCustom) {
						card.style.opacity = '1';
						card.classList.remove('border-transparent');
						card.classList.add('border-primary', 'bg-primary/5', 'shadow-md', 'scale-105');
						if (sublabel) {
							sublabel.textContent = customGemstoneName;
							sublabel.classList.remove('hidden');
						}
					} else {
						card.style.opacity = selectedGemstones.length > 0 ? '0.5' : '1';
						card.classList.remove('border-primary', 'bg-primary/5', 'shadow-md', 'scale-105');
						card.classList.add('border-transparent');
						if (sublabel) {
							sublabel.classList.add('hidden');
						}
					}
					return;
				}

				const match = onclickStr.match(/'gemstone',\s*'([^']+)'/);
				const val = match ? match[1] : '';
				
				if (val && selectedGemstones.includes(val)) {
					card.style.opacity = '1';
					card.classList.remove('border-transparent');
					card.classList.add('border-primary', 'bg-primary/5', 'shadow-md', 'scale-105');
				} else {
					card.style.opacity = selectedGemstones.length > 0 ? '0.5' : '1';
					card.classList.remove('border-primary', 'bg-primary/5', 'shadow-md', 'scale-105');
					card.classList.add('border-transparent');
				}
			});
		}

		function goToNext(url) {
			window.location.href = url;
		}
	</script>
</body>
</html>
